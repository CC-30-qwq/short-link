# Docker-Compose：一键启动（应用 + MySQL + Redis）
# 版本通过环境变量 APP_VERSION 控制，发布/回滚 = 切换这个变量
# 依赖就绪等待（depends_on.condition）需要 Compose v2（即 `docker compose` 命令）
services:
  app:
    image: shortlink:${APP_VERSION:-v1}   # 版本 = 镜像 tag
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis      # Redis 地址指向容器服务
      - MYSQL_HOST=mysql                  # MySQL 地址指向容器服务
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy        # 等 MySQL 就绪再启动，保证启动预加载能成功回填

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"       # 与 application.yml 默认密码一致
      MYSQL_DATABASE: short_link_db       # 首次启动自动建库
    ports:
      - "3307:3306"                       # 宿主机 3306 已被本地 MySQL80 占用，改映射 3307
    volumes:
      - mysql_data:/var/lib/mysql                                      # 数据持久化
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro  # 首次启动自动建表
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s                   # MySQL 首次初始化较慢，预留缓冲

volumes:
  mysql_data:
