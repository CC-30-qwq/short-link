server:
  port: 8080

spring:
  application:
    name: short-link-platform

  # === MySQL 数据源 ===
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/short_link_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 3000

  # === Redis 配置 ===
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # === Jackson 日期格式 ===
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# === MyBatis-Plus 配置 ===
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# === Knife4j API文档配置 ===
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: short-link-platform

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# === 短链接平台自定义配置 ===
shortlink:
  redis:
    enabled: true

  snowflake:
    worker-id: 1
    datacenter-id: 1

  bloom-filter:
    expected-insertions: 1000000
    false-probability: 0.01

  rate-limit:
    enabled: true
    permits-per-second: 100
    acquire-timeout-seconds: 3

  domain: http://localhost:8080

  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 200

logging:
  level:
    com.example.shortlink: DEBUG
    root: INFO
